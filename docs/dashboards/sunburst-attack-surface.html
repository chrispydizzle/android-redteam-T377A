<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SM-T377A — Sunburst Attack Surface</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  :root{--bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#c9d1d9;--muted:#8b949e}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;display:flex;min-height:100vh}

  .sidebar{width:320px;background:var(--surface);border-right:1px solid var(--border);padding:24px;overflow-y:auto;flex-shrink:0}
  .sidebar h1{font-size:18px;font-weight:600;color:#f0f6fc;margin-bottom:4px}
  .sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:24px;line-height:1.5}

  .breadcrumb{font-size:12px;color:var(--muted);margin-bottom:16px;min-height:20px}
  .breadcrumb span{cursor:pointer;color:var(--text)}
  .breadcrumb span:hover{color:#58a6ff;text-decoration:underline}

  .detail-section{margin-bottom:20px}
  .detail-section h3{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
  .detail-item{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px}
  .detail-item:last-child{border-bottom:none}
  .detail-item .name{color:var(--text)}
  .detail-item .val{font-weight:600}

  .severity-bar{height:6px;border-radius:3px;margin-top:4px;background:var(--border)}
  .severity-bar .fill{height:100%;border-radius:3px;transition:width .4s}

  .main-viz{flex:1;display:flex;align-items:center;justify-content:center;position:relative}

  svg text{fill:var(--text);font-family:inherit}

  .arc-path{cursor:pointer;transition:opacity .2s}
  .arc-path:hover{opacity:1!important}

  .center-label{text-anchor:middle;dominant-baseline:central;pointer-events:none}

  .tooltip{
    position:absolute;display:none;padding:10px 14px;
    background:#1c2128;border:1px solid var(--border);border-radius:6px;
    pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.5);font-size:12px;z-index:100;
    max-width:260px;line-height:1.5;
  }
  .tooltip strong{color:#f0f6fc}

  .legend{margin-top:20px}
  .legend-item{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:11px;cursor:pointer}
  .legend-item:hover{color:#f0f6fc}
  .legend-swatch{width:10px;height:10px;border-radius:2px;flex-shrink:0}

  @media(max-width:900px){
    body{flex-direction:column}
    .sidebar{width:100%;max-height:200px}
  }
</style>
</head>
<body>

<div class="sidebar">
  <h1>🎯 Attack Surface Sunburst</h1>
  <div class="sub">Hierarchical view: Category → Severity → Finding.<br/>Click to zoom in. Click center to zoom out.</div>

  <div class="breadcrumb" id="breadcrumb">Root</div>

  <div class="detail-section" id="detail-section">
    <h3>Current View</h3>
    <div id="detail-items"></div>
  </div>

  <div class="detail-section">
    <h3>Severity Breakdown</h3>
    <div id="severity-bars"></div>
  </div>

  <div class="legend">
    <h3 style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px">Severity</h3>
    <div id="legend-items"></div>
  </div>
</div>

<div class="main-viz">
  <svg id="sunburst"></svg>
  <div class="tooltip" id="tooltip"></div>
</div>

<script>
// ═══════════════════════════════════════════════════
// DATA — Hierarchical: root → category → severity → finding
// ═══════════════════════════════════════════════════

const findings = [
  {name:"Dirty COW",category:"Kernel CVE",severity:"PATCHED",impact:0},
  {name:"pipe iov",category:"Kernel CVE",severity:"PATCHED",impact:0},
  {name:"Towelroot",category:"Kernel CVE",severity:"PATCHED",impact:0},
  {name:"Ping UAF",category:"Kernel CVE",severity:"PATCHED",impact:0},
  {name:"perf OOB",category:"Kernel CVE",severity:"PATCHED",impact:0},
  {name:"n_tty race",category:"Kernel CVE",severity:"PATCHED",impact:1},
  {name:"inotify race",category:"Kernel CVE",severity:"PATCHED",impact:0},
  {name:"perf 6786",category:"Kernel CVE",severity:"PATCHED",impact:0},
  {name:"perf 6001",category:"Kernel CVE",severity:"PATCHED",impact:0},
  {name:"Keyring overflow",category:"Kernel CVE",severity:"BLOCKED",impact:1},
  {name:"DCCP blocked",category:"Kernel CVE",severity:"BLOCKED",impact:1},
  {name:"mq_notify",category:"Kernel CVE",severity:"N/A",impact:0},
  {name:"perf_event access",category:"Kernel CVE",severity:"MEDIUM",impact:3},
  {name:"timerfd reachable",category:"Kernel CVE",severity:"MEDIUM",impact:4},
  {name:"Binder UAF 2215",category:"Binder",severity:"CRITICAL",impact:8},
  {name:"Samsung binder fix",category:"Binder",severity:"BLOCKED",impact:3},
  {name:"Binder ctx DoS",category:"Binder",severity:"HIGH",impact:5},
  {name:"BlueBorne EFS",category:"Bluetooth",severity:"CRITICAL",impact:10},
  {name:"BNEP channel",category:"Bluetooth",severity:"HIGH",impact:6},
  {name:"BT daemon crash",category:"Bluetooth",severity:"HIGH",impact:5},
  {name:"BT domain value",category:"Bluetooth",severity:"MEDIUM",impact:5},
  {name:"ION UAF 91%",category:"ION Heap",severity:"HIGH",impact:6},
  {name:"ION heap DoS",category:"ION Heap",severity:"HIGH",impact:5},
  {name:"Mali false pos",category:"Mali GPU",severity:"LOW",impact:1},
  {name:"pm grant abuse",category:"Services",severity:"HIGH",impact:6},
  {name:"AM/PM abuse",category:"Services",severity:"HIGH",impact:5},
  {name:"DRParser goldmine",category:"Services",severity:"MEDIUM",impact:5},
  {name:"SmartcomRoot",category:"Services",severity:"MEDIUM",impact:4},
  {name:"Factory broadcast",category:"Services",severity:"LOW",impact:2},
  {name:"SysDump bypass",category:"Services",severity:"HIGH",impact:7},
  {name:"Device Owner",category:"APK Agent",severity:"HIGH",impact:7},
  {name:"Accessibility UI",category:"APK Agent",severity:"HIGH",impact:6},
  {name:"TIMA addr leak",category:"Info Disclosure",severity:"HIGH",impact:7},
  {name:"debugfs/dmesg",category:"Info Disclosure",severity:"MEDIUM",impact:5},
  {name:"WiFi intel leak",category:"Info Disclosure",severity:"MEDIUM",impact:4},
  {name:"slabinfo readable",category:"Info Disclosure",severity:"MEDIUM",impact:4},
  {name:"43K symbols",category:"Info Disclosure",severity:"MEDIUM",impact:5},
  {name:"/data/log write",category:"Info Disclosure",severity:"LOW",impact:2},
  {name:"tee() deadlock",category:"Kernel Fuzzing",severity:"MEDIUM",impact:4},
  {name:"NETLINK_ROUTE",category:"Kernel Fuzzing",severity:"LOW",impact:2},
  {name:"SELinux dead end",category:"SELinux",severity:"BLOCKED",impact:0},
  {name:"DM port AT",category:"Modem/AT",severity:"HIGH",impact:6},
];

const sevOrder = ["CRITICAL","HIGH","MEDIUM","LOW","BLOCKED","PATCHED","N/A"];
const sevColor = {CRITICAL:"#f85149",HIGH:"#d29922",MEDIUM:"#3fb950",LOW:"#6e7681",PATCHED:"#30363d",BLOCKED:"#30363d","N/A":"#21262d"};

const catColor = d3.scaleOrdinal()
  .domain(["Kernel CVE","Binder","Bluetooth","ION Heap","Mali GPU","Services","Info Disclosure","Kernel Fuzzing","SELinux","Modem/AT","APK Agent"])
  .range(["#f85149","#d29922","#58a6ff","#3fb950","#bc8cff","#f0883e","#79c0ff","#56d364","#8b949e","#ff7b72","#d2a8ff"]);

// Build hierarchy
const root = {name: "Root", children: []};
const catGroups = d3.group(findings, f => f.category);
catGroups.forEach((catFindings, category) => {
  const sevGroups = d3.group(catFindings, f => f.severity);
  const catNode = {name: category, children: []};
  sevOrder.forEach(sev => {
    const group = sevGroups.get(sev);
    if (!group) return;
    catNode.children.push({
      name: sev,
      children: group.map(f => ({name: f.name, value: Math.max(f.impact, 1), impact: f.impact, severity: f.severity, category: f.category}))
    });
  });
  root.children.push(catNode);
});

// ═══════════════════════════════════════════════════
// SUNBURST
// ═══════════════════════════════════════════════════

const size = Math.min(window.innerWidth - 320, window.innerHeight) - 40;
const radius = size / 2;

const svg = d3.select("#sunburst")
  .attr("width", size).attr("height", size)
  .append("g")
  .attr("transform", `translate(${size/2},${size/2})`);

const partition = d3.partition().size([2 * Math.PI, radius]);

const hierarchy = d3.hierarchy(root)
  .sum(d => d.value || 0)
  .sort((a, b) => b.value - a.value);

partition(hierarchy);

const arc = d3.arc()
  .startAngle(d => d.x0)
  .endAngle(d => d.x1)
  .padAngle(d => Math.min((d.x1 - d.x0) / 2, 0.005))
  .padRadius(radius / 2)
  .innerRadius(d => d.y0)
  .outerRadius(d => d.y1 - 1);

const tooltip = d3.select("#tooltip");

// Color function based on depth
function getColor(d) {
  if (d.depth === 0) return "var(--bg)";
  if (d.depth === 1) return catColor(d.data.name); // category
  if (d.depth === 2) return sevColor[d.data.name]; // severity
  if (d.depth === 3) return sevColor[d.data.severity]; // finding
  return "#333";
}

function getOpacity(d) {
  if (d.depth === 0) return 0;
  if (d.depth === 1) return 0.7;
  if (d.depth === 2) return 0.6;
  return 0.8;
}

// Draw arcs
const paths = svg.selectAll("path")
  .data(hierarchy.descendants().filter(d => d.depth > 0))
  .join("path")
  .attr("class", "arc-path")
  .attr("d", arc)
  .attr("fill", getColor)
  .attr("opacity", getOpacity)
  .attr("stroke", "var(--bg)")
  .attr("stroke-width", 0.5);

// Labels for category ring
svg.selectAll(".cat-label")
  .data(hierarchy.children || [])
  .join("text")
  .attr("class", "cat-label")
  .attr("transform", d => {
    const angle = (d.x0 + d.x1) / 2;
    const r = (d.y0 + d.y1) / 2;
    const x = Math.sin(angle) * r;
    const y = -Math.cos(angle) * r;
    const rot = angle * 180 / Math.PI - 90;
    return `translate(${x},${y}) rotate(${rot > 90 ? rot + 180 : rot})`;
  })
  .attr("text-anchor", "middle")
  .attr("dy", "0.35em")
  .style("font-size", d => (d.x1 - d.x0) > 0.3 ? "10px" : "8px")
  .style("fill", "var(--text)")
  .style("pointer-events", "none")
  .text(d => (d.x1 - d.x0) > 0.15 ? d.data.name : "");

// Center text
const centerText = svg.append("text")
  .attr("class", "center-label")
  .style("font-size", "14px")
  .style("font-weight", "600")
  .style("fill", "#f0f6fc");

const centerSub = svg.append("text")
  .attr("class", "center-label")
  .attr("dy", "1.4em")
  .style("font-size", "11px")
  .style("fill", "var(--muted)");

centerText.text(findings.length);
centerSub.text("Total Findings");

// Hover
paths.on("mouseover", function(event, d) {
  d3.select(this).attr("opacity", 1);
  let html = `<strong>${d.data.name}</strong>`;
  if (d.depth === 3) {
    html += `<br/>Impact: ${'█'.repeat(d.data.impact)}${'░'.repeat(10-d.data.impact)} ${d.data.impact}/10`;
    html += `<br/><span style="color:${sevColor[d.data.severity]}">${d.data.severity}</span> · ${d.data.category}`;
  } else {
    html += `<br/>${d.value} finding${d.value !== 1 ? 's' : ''} · ${d.descendants().filter(n=>n.depth===d.depth+1||(!n.children&&n!==d)).length} items`;
  }
  tooltip.style("display", "block")
    .style("left", (event.pageX + 12) + "px")
    .style("top", (event.pageY - 12) + "px")
    .html(html);
})
.on("mousemove", function(event) {
  tooltip.style("left", (event.pageX + 12) + "px").style("top", (event.pageY - 12) + "px");
})
.on("mouseout", function(event, d) {
  d3.select(this).attr("opacity", getOpacity(d));
  tooltip.style("display", "none");
});

// Click to zoom
let currentRoot = hierarchy;

paths.on("click", function(event, d) {
  if (d.depth < 3) {
    zoomTo(d);
  }
});

// Center click to zoom out
svg.append("circle")
  .attr("r", hierarchy.y0 || radius * 0.15)
  .attr("fill", "transparent")
  .style("cursor", "pointer")
  .on("click", () => {
    if (currentRoot.parent) zoomTo(currentRoot.parent);
  });

function zoomTo(node) {
  currentRoot = node;

  const t = svg.transition().duration(600);

  paths.transition(t)
    .tween("data", d => {
      const i = d3.interpolate(
        { x0: d.x0, x1: d.x1, y0: d.y0, y1: d.y1 },
        {
          x0: Math.max(0, Math.min(1, (d.x0 - node.x0) / (node.x1 - node.x0))) * 2 * Math.PI,
          x1: Math.max(0, Math.min(1, (d.x1 - node.x0) / (node.x1 - node.x0))) * 2 * Math.PI,
          y0: Math.max(0, d.y0 - node.y0),
          y1: Math.max(0, d.y1 - node.y0)
        }
      );
      return t => { const n = i(t); d.x0 = n.x0; d.x1 = n.x1; d.y0 = n.y0; d.y1 = n.y1; };
    })
    .attrTween("d", d => () => arc(d))
    .attr("opacity", d => {
      if (d.x1 <= d.x0) return 0;
      return getOpacity(d);
    });

  // Update breadcrumb
  const chain = node.ancestors().reverse();
  d3.select("#breadcrumb").html(
    chain.map((n, i) => `<span onclick="window._zoomTo(${i})">${n.data.name}</span>`).join(" → ")
  );

  // Update center
  if (node.depth === 0) {
    centerText.text(findings.length);
    centerSub.text("Total Findings");
  } else {
    const leaves = node.leaves().length;
    centerText.text(leaves);
    centerSub.text(node.data.name);
  }

  updateSidebar(node);
}

window._zoomTo = function(depth) {
  const chain = currentRoot.ancestors().reverse();
  if (depth < chain.length) zoomTo(chain[depth]);
};

// ═══════════════════════════════════════════════════
// SIDEBAR
// ═══════════════════════════════════════════════════

function updateSidebar(node) {
  const items = d3.select("#detail-items");
  items.html("");

  const leaves = node.leaves();
  const top = leaves.sort((a, b) => (b.data.impact || 0) - (a.data.impact || 0)).slice(0, 8);

  top.forEach(d => {
    const item = items.append("div").attr("class", "detail-item");
    item.append("span").attr("class", "name").text(d.data.name);
    item.append("span").attr("class", "val")
      .style("color", sevColor[d.data.severity] || "var(--muted)")
      .text(d.data.impact !== undefined ? `${d.data.impact}/10` : "");
  });
}

function drawSeverityBars() {
  const container = d3.select("#severity-bars");
  const sevCounts = d3.rollup(findings, v => v.length, d => d.severity);
  const total = findings.length;

  sevOrder.forEach(sev => {
    const count = sevCounts.get(sev) || 0;
    if (count === 0) return;
    const item = container.append("div").style("margin-bottom", "8px");
    item.append("div").style("display", "flex").style("justify-content", "space-between").style("font-size", "11px")
      .html(`<span style="color:${sevColor[sev]}">${sev}</span><span>${count}</span>`);
    const bar = item.append("div").attr("class", "severity-bar");
    bar.append("div").attr("class", "fill")
      .style("width", `${(count / total) * 100}%`)
      .style("background", sevColor[sev]);
  });
}

function drawLegend() {
  const container = d3.select("#legend-items");
  sevOrder.forEach(sev => {
    const count = findings.filter(f => f.severity === sev).length;
    if (count === 0) return;
    const item = container.append("div").attr("class", "legend-item");
    item.append("div").attr("class", "legend-swatch").style("background", sevColor[sev]);
    item.append("span").text(`${sev} (${count})`);
  });
}

updateSidebar(hierarchy);
drawSeverityBars();
drawLegend();
</script>
</body>
</html>
