// ── 3D PROJECTION ──

function project(x3d, y3d, z3d) {
  // Rotate by camera angles
  const cosT = Math.cos(camTheta), sinT = Math.sin(camTheta);
  const cosP = Math.cos(camPhi), sinP = Math.sin(camPhi);
  
  let x = x3d * cosT - y3d * sinT;
  let y2 = x3d * sinT + y3d * cosT;
  let y = y2 * cosP - z3d * sinP;
  let z = y2 * sinP + z3d * cosP;
  
  // Perspective projection
  const perspective = camDist / (camDist + z + 0.5);
  const screenX = W/2 + x * perspective * Math.min(W, H) * 0.75;
  const screenY = H/2 + y * perspective * Math.min(W, H) * 0.75;
  
  return { x: screenX, y: screenY, scale: perspective, z: z };
}

// ── RENDER ──

function render() {
  time += 0.016;
  
  // Smooth camera
  camTheta += (targetTheta - camTheta) * 0.05;
  camPhi += (targetPhi - camPhi) * 0.05;
  camDist += (targetDist - camDist) * 0.05;
  
  // Auto-rotate slowly
  if (!isDragging && !selectedStar) {
    targetTheta += 0.0008;
  }
  
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  
  // Background stars
  for (const s of bgStars) {
    const p = project(s.x * 3, s.y * 3, s.z * 2 - 1);
    const twinkle = 0.5 + 0.5 * Math.sin(time * s.twinkle);
    const alpha = s.brightness * twinkle * p.scale;
    ctx.fillStyle = `rgba(180,200,240,${alpha})`;
    ctx.fillRect(p.x, p.y, s.size * p.scale, s.size * p.scale);
  }
  
  // Nebula clouds
  for (const neb of nebulae) {
    for (const p of neb.particles) {
      const proj = project(p.x, p.y, 0);
      const sz = p.size * proj.scale;
      const grad = ctx.createRadialGradient(proj.x, proj.y, 0, proj.x, proj.y, sz);
      const [r,g,b] = p.color;
      grad.addColorStop(0, `rgba(${r},${g},${b},${p.alpha * 1.5})`);
      grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
      ctx.fillStyle = grad;
      ctx.fillRect(proj.x - sz, proj.y - sz, sz * 2, sz * 2);
    }
  }
  
  // ── FUZZING PARTICLE SWARM ──
  for (const fp of fuzzParticles) {
    const wobble = Math.sin(time * fp.speed * 10 + fp.phase) * 0.02;
    const px = fp.x + wobble;
    const py = fp.y + Math.cos(time * fp.speed * 8 + fp.phase) * 0.02;
    const p = project(px, py, fp.z);
    const alpha = 0.15 + 0.1 * Math.sin(time * 3 + fp.phase);
    if (fp.hasBug) {
      ctx.fillStyle = `rgba(255,77,77,${alpha * 2})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, fp.size * p.scale * 2, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = `rgba(100,200,255,${alpha})`;
      ctx.fillRect(p.x, p.y, fp.size * p.scale, fp.size * p.scale);
    }
  }
  
  // Orbital rings (constellation boundaries)
  ctx.strokeStyle = 'rgba(88,166,255,0.04)';
  ctx.lineWidth = 1;
  for (let r = 0.2; r <= 0.85; r += 0.15) {
    ctx.beginPath();
    for (let a = 0; a <= Math.PI * 2; a += 0.05) {
      const p = project(Math.cos(a) * r, Math.sin(a) * r, 0);
      if (a === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();
  }
  
  // Center black hole (the device)
  const center = project(0, 0, 0);
  const bhSize = 25 * center.scale;
  const bhGrad = ctx.createRadialGradient(center.x, center.y, 0, center.x, center.y, bhSize * 3);
  bhGrad.addColorStop(0, 'rgba(20,10,40,0.8)');
  bhGrad.addColorStop(0.3, 'rgba(60,30,120,0.15)');
  bhGrad.addColorStop(0.6, 'rgba(88,166,255,0.05)');
  bhGrad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = bhGrad;
  ctx.fillRect(center.x - bhSize*3, center.y - bhSize*3, bhSize*6, bhSize*6);
  
  // Accretion disk
  ctx.strokeStyle = 'rgba(88,166,255,0.08)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let a = 0; a <= Math.PI * 2; a += 0.02) {
    const wobble = 1 + 0.05 * Math.sin(a * 3 + time * 0.5);
    const p = project(Math.cos(a) * 0.08 * wobble, Math.sin(a) * 0.08 * wobble, 0);
    if (a === 0) ctx.moveTo(p.x, p.y);
    else ctx.lineTo(p.x, p.y);
  }
  ctx.stroke();
  
  // Connection lines (dependencies = gravitational links)
  for (const star of stars) {
    if (!isVisible(star)) continue;
    for (const depId of star.deps) {
      const dep = stars[depId];
      if (!dep || !isVisible(dep)) continue;
      const p1 = project(star.x3d, star.y3d, star.z3d);
      const p2 = project(dep.x3d, dep.y3d, dep.z3d);
      
      const alpha = selectedStar && (selectedStar.id === star.id || selectedStar.id === dep.id) ? 0.4 : 0.06;
      const [r,g,b] = sevColor[star.sev] || [80,100,140];
      
      ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
      ctx.lineWidth = selectedStar && (selectedStar.id === star.id || selectedStar.id === dep.id) ? 2 : 0.5;
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      // Curved line through midpoint offset toward center
      const mx = (p1.x + p2.x) / 2 + (center.x - (p1.x + p2.x) / 2) * 0.2;
      const my = (p1.y + p2.y) / 2 + (center.y - (p1.y + p2.y) / 2) * 0.2;
      ctx.quadraticCurveTo(mx, my, p2.x, p2.y);
      ctx.stroke();
    }
  }
  
  // Sort stars by Z for proper depth ordering
  const projected = stars.map(s => {
    const p = project(s.x3d, s.y3d, s.z3d);
    return { star: s, px: p.x, py: p.y, scale: p.scale, z: p.z };
  }).sort((a, b) => a.z - b.z);
  
  // Draw stars
  for (const {star, px, py, scale} of projected) {
    if (!isVisible(star)) continue;
    
    const pulse = 1 + 0.15 * Math.sin(time * star.twinkleSpeed + star.pulsePhase);
    const radius = star.baseRadius * scale * pulse;
    const [r,g,b] = sevColor[star.sev] || [80,100,140];
    const glowSize = sevGlow[star.sev] * scale;
    const isSelected = selectedStar && selectedStar.id === star.id;
    const isFaded = selectedStar && !isSelected && !selectedStar.deps.includes(star.id) && !star.deps.includes(selectedStar.id);
    const alpha = isFaded ? 0.15 : 1;
    
    // Kill chain line
    if (currentFilter === 'killchain') {
      const idx = killChainOrder.indexOf(star.id);
      if (idx > 0) {
        const prevId = killChainOrder[idx - 1];
        const prev = projected.find(p => p.star.id === prevId);
        if (prev) {
          ctx.strokeStyle = `rgba(255,200,50,0.3)`;
          ctx.lineWidth = 2;
          ctx.setLineDash([4, 4]);
          ctx.beginPath();
          ctx.moveTo(prev.px, prev.py);
          ctx.lineTo(px, py);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      }
    }
    
    // Outer glow
    if (glowSize > 0) {
      const glow = ctx.createRadialGradient(px, py, 0, px, py, radius + glowSize);
      glow.addColorStop(0, `rgba(${r},${g},${b},${0.3 * alpha})`);
      glow.addColorStop(1, `rgba(${r},${g},${b},0)`);
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(px, py, radius + glowSize, 0, Math.PI * 2);
      ctx.fill();
    }
    
    // Core
    const coreGrad = ctx.createRadialGradient(px, py, 0, px, py, radius);
    coreGrad.addColorStop(0, `rgba(255,255,255,${0.9 * alpha})`);
    coreGrad.addColorStop(0.3, `rgba(${r},${g},${b},${0.8 * alpha})`);
    coreGrad.addColorStop(1, `rgba(${r},${g},${b},${0.2 * alpha})`);
    ctx.fillStyle = coreGrad;
    ctx.beginPath();
    ctx.arc(px, py, radius, 0, Math.PI * 2);
    ctx.fill();
    
    // Selection ring
    if (isSelected) {
      ctx.strokeStyle = `rgba(${r},${g},${b},0.8)`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(px, py, radius + 8, 0, Math.PI * 2);
      ctx.stroke();
      
      // Crosshair
      ctx.strokeStyle = `rgba(${r},${g},${b},0.3)`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(px - 20, py); ctx.lineTo(px + 20, py);
      ctx.moveTo(px, py - 20); ctx.lineTo(px, py + 20);
      ctx.stroke();
    }
    
    // Label for high-impact or selected
    if ((star.imp >= 6 || isSelected) && !isFaded && radius > 3) {
      ctx.font = `${isSelected ? 11 : 9}px 'SF Mono',Consolas,monospace`;
      ctx.fillStyle = `rgba(${r},${g},${b},${0.8 * alpha})`;
      ctx.textAlign = 'left';
      ctx.fillText(star.name, px + radius + 6, py + 3);
    }
  }
  
  // Constellation labels
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'center';
  categories.forEach((cat, i) => {
    const angle = catAngle[cat];
    const p = project(Math.cos(angle) * 0.92, Math.sin(angle) * 0.92, 0);
    ctx.fillStyle = 'rgba(88,166,255,0.2)';
    ctx.fillText(cat.toUpperCase(), p.x, p.y);
  });
  
  // ── SOURCE FILE MOONS ──
  for (const moon of srcMoons) {
    const parent = stars[moon.finding];
    if (!parent || !isVisible(parent)) continue;
    const orbitAngle = time * moon.orbitSpeed + moon.orbitPhase;
    const mx = parent.x3d + Math.cos(orbitAngle) * moon.orbitRadius;
    const my = parent.y3d + Math.sin(orbitAngle) * moon.orbitRadius;
    const mz = parent.z3d + Math.sin(orbitAngle * 0.7) * moon.orbitRadius * 0.3;
    const p = project(mx, my, mz);
    const [r,g,b] = moon.color;
    const isFaded = selectedStar && selectedStar.id !== moon.finding;
    const alpha = isFaded ? 0.05 : 0.6;
    
    // Orbit trail
    if (!isFaded) {
      ctx.strokeStyle = `rgba(${r},${g},${b},0.06)`;
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      const pp = project(parent.x3d, parent.y3d, parent.z3d);
      for (let a = 0; a <= Math.PI * 2; a += 0.2) {
        const ox = parent.x3d + Math.cos(a) * moon.orbitRadius;
        const oy = parent.y3d + Math.sin(a) * moon.orbitRadius;
        const op = project(ox, oy, parent.z3d);
        if (a === 0) ctx.moveTo(op.x, op.y);
        else ctx.lineTo(op.x, op.y);
      }
      ctx.stroke();
    }
    
    // Moon dot
    ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, moon.size * p.scale, 0, Math.PI * 2);
    ctx.fill();
    
    // Moon label on hover proximity or when parent selected
    if (selectedStar && selectedStar.id === moon.finding) {
      ctx.font = '8px monospace';
      ctx.fillStyle = `rgba(${r},${g},${b},0.5)`;
      ctx.textAlign = 'left';
      ctx.fillText(moon.name, p.x + moon.size * p.scale + 3, p.y + 3);
    }
  }
  
  // ── PII WARNING BEACONS ──
  for (const beacon of piiBeacons) {
    const p = project(beacon.x, beacon.y, beacon.z);
    const pulse = 0.5 + 0.5 * Math.sin(time * 2.5 + beacon.pulsePhase);
    const isCrit = beacon.severity === 'CRITICAL';
    const color = isCrit ? [255,50,50] : [255,160,40];
    const [r,g,b] = color;
    const sz = (isCrit ? 14 : 10) * p.scale;
    
    // Pulsing ring
    ctx.strokeStyle = `rgba(${r},${g},${b},${0.15 + pulse * 0.25})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(p.x, p.y, sz + pulse * 8 * p.scale, 0, Math.PI * 2);
    ctx.stroke();
    
    // Inner ring
    ctx.strokeStyle = `rgba(${r},${g},${b},${0.3 + pulse * 0.3})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(p.x, p.y, sz, 0, Math.PI * 2);
    ctx.stroke();
    
    // Warning triangle
    ctx.fillStyle = `rgba(${r},${g},${b},${0.4 + pulse * 0.3})`;
    ctx.font = `${Math.round(12 * p.scale)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('⚠', p.x, p.y + 4 * p.scale);
    
    // Label
    ctx.font = `${Math.round(9 * p.scale)}px monospace`;
    ctx.fillStyle = `rgba(${r},${g},${b},0.6)`;
    ctx.fillText(beacon.name, p.x, p.y + sz + 12 * p.scale);
    ctx.fillStyle = `rgba(${r},${g},${b},0.3)`;
    ctx.fillText(`${beacon.files} files`, p.x, p.y + sz + 22 * p.scale);
  }
  
  // ── GRAVEYARD (blocked paths drifting into void) ──
  for (const ghost of graveyard) {
    ghost.x += ghost.drift; // slowly drifting outward
    if (ghost.x > 2) ghost.x = 1.1; // wrap around
    const p = project(ghost.x, ghost.y, ghost.z);
    const fade = Math.max(0, 1 - (ghost.x - 1.1) * 2);
    
    // Ghostly cross
    ctx.strokeStyle = `rgba(80,90,110,${ghost.alpha * fade * 0.3})`;
    ctx.lineWidth = 1;
    const csz = ghost.size * p.scale * 3;
    ctx.beginPath();
    ctx.moveTo(p.x - csz, p.y); ctx.lineTo(p.x + csz, p.y);
    ctx.moveTo(p.x, p.y - csz); ctx.lineTo(p.x, p.y + csz * 0.7);
    ctx.stroke();
    
    // Name
    ctx.font = `${Math.round(8 * p.scale)}px monospace`;
    ctx.fillStyle = `rgba(80,90,110,${ghost.alpha * fade * 0.5})`;
    ctx.textAlign = 'center';
    ctx.fillText(ghost.name, p.x, p.y + csz + 10 * p.scale);
    ctx.fillStyle = `rgba(60,70,85,${ghost.alpha * fade * 0.3})`;
    ctx.font = `${Math.round(7 * p.scale)}px monospace`;
    ctx.fillText(ghost.reason, p.x, p.y + csz + 19 * p.scale);
  }
  
  // HUD coordinate display
  document.getElementById('coord-display').textContent =
    `θ: ${camTheta.toFixed(2)} · φ: ${camPhi.toFixed(2)} · r: ${camDist.toFixed(2)} · ${fuzzParticles.length} fuzz particles · ${srcMoons.length} source moons · ${piiBeacons.length} PII beacons · ${graveyard.length} dead paths`;
  
  requestAnimationFrame(render);
}

function isVisible(star) {
  if (currentFilter === 'all') return true;
  if (currentFilter === 'live') return !['PATCHED','BLOCKED','N/A'].includes(star.sev);
  if (currentFilter === 'critical') return star.sev === 'CRITICAL' || (selectedStar && (star.deps.includes(selectedStar.id) || selectedStar.deps.includes(star.id)));
  if (currentFilter === 'pii') return star.cat === 'Info Disclosure' || star.imp >= 5;
  if (currentFilter === 'graveyard') return !['PATCHED','BLOCKED','N/A'].includes(star.sev);
  if (currentFilter === 'killchain') return killChainOrder.includes(star.id);
  return true;
}

// ── INTERACTION ──

canvas.addEventListener('mousedown', e => {
  isDragging = true;
  lastMouse = { x: e.clientX, y: e.clientY };
});

canvas.addEventListener('mousemove', e => {
  if (isDragging) {
    const dx = e.clientX - lastMouse.x;
    const dy = e.clientY - lastMouse.y;
    targetTheta += dx * 0.005;
    targetPhi = Math.max(-1.2, Math.min(1.2, targetPhi + dy * 0.005));
    lastMouse = { x: e.clientX, y: e.clientY };
  }
});

canvas.addEventListener('mouseup', () => isDragging = false);
canvas.addEventListener('mouseleave', () => isDragging = false);

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  targetDist = Math.max(0.1, Math.min(5, targetDist + e.deltaY * 0.003));
});

canvas.addEventListener('click', e => {
  const mx = e.clientX, my = e.clientY;
  let closest = null, closestDist = 20;
  
  for (const star of stars) {
    if (!isVisible(star)) continue;
    const p = project(star.x3d, star.y3d, star.z3d);
    const dist = Math.hypot(p.x - mx, p.y - my);
    if (dist < closestDist) {
      closest = star;
      closestDist = dist;
    }
  }
  
  if (closest) {
    selectedStar = closest;
    showInfo(closest);
    document.getElementById('focused-name').textContent = closest.name.toUpperCase();
    document.getElementById('focused-sub').innerHTML =
      `${closest.cat} · Session ${closest.sess} · Impact ${closest.imp}/10`;
  } else {
    selectedStar = null;
    document.getElementById('info-panel').classList.remove('visible');
    document.getElementById('focused-name').textContent = 'OVERVIEW';
    document.getElementById('focused-sub').innerHTML = '42 findings · 13 sessions · 236M fuzz ops<br/>Click a star to inspect. Scroll to zoom. Drag to orbit.';
  }
});

function showInfo(star) {
  const panel = document.getElementById('info-panel');
  panel.classList.add('visible');
  document.getElementById('info-title').textContent = star.name;
  
  const [r,g,b] = sevColor[star.sev];
  const sevStyle = `background:rgba(${r},${g},${b},0.2);color:rgb(${r},${g},${b})`;
  
  let connectionsHtml = '';
  const allConnected = [...star.deps];
  stars.forEach(s => { if (s.deps.includes(star.id) && !allConnected.includes(s.id)) allConnected.push(s.id); });
  
  if (allConnected.length > 0) {
    connectionsHtml = '<div class="connections"><div style="font-size:10px;color:rgba(180,200,220,.4);margin-bottom:4px">GRAVITATIONAL LINKS</div>';
    allConnected.forEach(id => {
      const s = stars[id];
      if (s) {
        const [cr,cg,cb] = sevColor[s.sev];
        connectionsHtml += `<div class="conn" onclick="focusStar(${id})">→ ${s.name} <span style="color:rgb(${cr},${cg},${cb})">(${s.sev})</span></div>`;
      }
    });
    connectionsHtml += '</div>';
  }
  
  document.getElementById('info-body').innerHTML = `
    <span class="sev-tag" style="${sevStyle}">${star.sev}</span>
    <div class="field"><span class="k">Category</span><span class="val">${star.cat}</span></div>
    <div class="field"><span class="k">Session</span><span class="val">${star.sess}</span></div>
    <div class="field"><span class="k">Impact</span><span class="val">${'█'.repeat(star.imp)}${'░'.repeat(10-star.imp)} ${star.imp}/10</span></div>
    <div class="field"><span class="k">Constellation</span><span class="val">${star.cat}</span></div>
    <div class="detail">${star.detail}</div>
    ${connectionsHtml}
  `;
}

window.focusStar = function(id) {
  const star = stars[id];
  if (!star) return;
  selectedStar = star;
  showInfo(star);
  document.getElementById('focused-name').textContent = star.name.toUpperCase();
  document.getElementById('focused-sub').innerHTML = `${star.cat} · Session ${star.sess} · Impact ${star.imp}/10`;
  // Fly camera toward it
  targetTheta = -Math.atan2(star.y3d, star.x3d) + Math.PI/2;
  targetDist = 0.6;
};

// Filter buttons
document.querySelectorAll('.ctrl').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.ctrl').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    currentFilter = this.dataset.filter;
    selectedStar = null;
    document.getElementById('info-panel').classList.remove('visible');
  });
});

// ── GO ──
render();
</script>
</body>
